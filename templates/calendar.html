<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — WINK</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/calendar.css') }}">
  <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body>

  {% include "_nav.html" %}

  <div class="page-shell">
    <div class="cal-header">
      <h1>📅 Master Calendar</h1>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
        <div class="cal-month-label" id="month-label"></div>
        <button class="cal-nav-btn" onclick="changeMonth(1)" aria-label="Next month">›</button>
        <button class="cal-today-btn" onclick="goToday()">Today</button>
      </div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="cal-grid">
      <div class="cal-weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <span class="empty-icon">📭</span>
      <h3>No deadlines found yet</h3>
      <p>Upload a syllabus with a schedule of due dates on the <a href="/documents" style="color:#FF8200;font-weight:600;">Documents</a> page, and WINK will plot them here automatically.</p>
    </div>
  </div>

  <!-- Day detail panel -->
  <div class="day-panel" id="day-panel" onclick="if(event.target===this) closeDayPanel()">
    <div class="day-panel-card" role="dialog" aria-modal="true" aria-labelledby="day-panel-title">
      <div class="day-panel-header">
        <h2 id="day-panel-title">—</h2>
        <button class="day-panel-close" onclick="closeDayPanel()" aria-label="Close">✕</button>
      </div>
      <div id="day-panel-body"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/csrf-fetch.js') }}"></script>
  <script src="{{ url_for('static', filename='js/course-colors.js') }}"></script>
<script nonce="{{ csp_nonce() }}">
    let allDeadlines = [];
    let deadlinesByDate = {};
    let courseColors = {};
    let viewYear, viewMonth; // viewMonth is 0-indexed

    // Colors now come from the shared hash in course-colors.js (see
    // winkColorForCourse) so Documents and Calendar always agree — this
    // just caches the lookup per page load instead of recomputing the hash
    // on every render.
    function colorForCourse(course) {
      if (!(course in courseColors)) {
        courseColors[course] = winkColorForCourse(course);
      }
      return courseColors[course];
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    // Sets background-color (and, if present, text color) via the DOM style
    // property (never restricted by CSP, unlike the style="..." HTML
    // attribute) for any element rendered with data-bg / data-fg
    // placeholders instead of an inline style string.
    function applyPendingBackgrounds(root) {
      root.querySelectorAll('[data-bg]').forEach(el => {
        el.style.background = el.dataset.bg;
        el.removeAttribute('data-bg');
      });
      root.querySelectorAll('[data-fg]').forEach(el => {
        el.style.color = el.dataset.fg;
        el.removeAttribute('data-fg');
      });
    }

    // Delegated: calendar day cells carry data-date instead of a per-cell
    // inline onclick/onkeydown (the date differs every cell, so it can't be
    // CSP-hash-allowlisted) — one listener on the grid covers all of them,
    // including ones re-rendered on month navigation.
    document.getElementById('cal-days').addEventListener('click', function(e) {
      const cell = e.target.closest('[data-date]');
      if (cell) openDayPanel(cell.dataset.date);
    });
    document.getElementById('cal-days').addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const cell = e.target.closest('[data-date]');
      if (cell) { e.preventDefault(); openDayPanel(cell.dataset.date); }
    });

    function renderLegend() {
      const legend = document.getElementById('legend');
      const courses = Object.keys(courseColors);
      if (courses.length === 0) { legend.innerHTML = ''; return; }
      legend.innerHTML = courses.map(c =>
        `<div class="legend-item"><span class="legend-dot" data-bg="${courseColors[c]}"></span><span data-fg="${courseColors[c]}" style="font-weight:700;">${escapeHtml(c)}</span></div>`
      ).join('');
      applyPendingBackgrounds(legend);
    }

    function renderCalendar() {
      document.getElementById('month-label').textContent =
        new Date(viewYear, viewMonth, 1).toLocaleString('default', { month: 'long', year: 'numeric' });

      const firstOfMonth = new Date(viewYear, viewMonth, 1);
      const startDow = firstOfMonth.getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

      const todayStr = new Date().toISOString().slice(0, 10);
      const cells = [];

      // Leading days from previous month
      for (let i = 0; i < startDow; i++) {
        const d = daysInPrevMonth - startDow + i + 1;
        cells.push({ day: d, otherMonth: true, dateStr: null });
      }
      // Days in current month
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${viewYear}-${pad(viewMonth+1)}-${pad(d)}`;
        cells.push({ day: d, otherMonth: false, dateStr });
      }
      // Trailing days to fill final week
      while (cells.length % 7 !== 0) {
        cells.push({ day: cells.length, otherMonth: true, dateStr: null });
      }

      const wrap = document.getElementById('cal-days');
      wrap.innerHTML = cells.map(cell => {
        const items = cell.dateStr ? (deadlinesByDate[cell.dateStr] || []) : [];
        const isToday = cell.dateStr === todayStr;
        const chips = items.slice(0, 3).map(it => {
          const bg = colorForCourse(it.course);
          return `<div class="cal-chip" data-bg="${bg}" data-fg="${winkTextColorForBg(bg)}" title="${escapeHtml(it.title)}">${escapeHtml(it.title)}</div>`;
        }).join('');
        const more = items.length > 3 ? `<div class="cal-more">+${items.length - 3} more</div>` : '';
        const classes = ['cal-day'];
        if (cell.otherMonth) classes.push('other-month');
        if (isToday) classes.push('today');
        let interactiveAttrs = '';
        if (cell.dateStr) {
          const label = `${cell.day}${isToday ? ', today' : ''}${items.length ? `, ${items.length} item${items.length !== 1 ? 's' : ''} due` : ', nothing due'}`;
          interactiveAttrs = `data-date="${cell.dateStr}" tabindex="0" role="button" aria-label="${escapeHtml(label)}"`;
        }
        return `<div class="${classes.join(' ')}" ${interactiveAttrs}>
          <div class="cal-day-num${items.length ? ' has-items' : ''}">${cell.day}</div>
          ${chips}${more}
        </div>`;
      }).join('');
      applyPendingBackgrounds(wrap);
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    let dayPanelLastFocus = null;

    let currentPanelDate = null;

    function openDayPanel(dateStr) {
      currentPanelDate = dateStr;
      const items = deadlinesByDate[dateStr] || [];
      const dateObj = new Date(dateStr + 'T00:00:00');
      document.getElementById('day-panel-title').textContent =
        dateObj.toLocaleDateString('default', { weekday: 'long', month: 'long', day: 'numeric' });
      const body = document.getElementById('day-panel-body');
      if (items.length === 0) {
        body.innerHTML = '<div class="day-empty">Nothing due this day.</div>';
      } else {
        body.innerHTML = items.map(it => {
          const status = it.status || 'detected';
          const statusLabel = status === 'confirmed' ? 'Confirmed'
            : status === 'corrected' ? 'Corrected'
            : status === 'superseded' ? 'Dismissed'
            : 'Unconfirmed — AI-detected';
          const snippet = it.source_snippet
            ? `<div class="day-item-snippet">Found in: “${escapeHtml(it.source_snippet)}”</div>` : '';
          const actions = status === 'detected' ? `
            <div class="day-item-actions" data-id="${it.id}">
              <button class="primary" data-action="confirm">✓ Confirm</button>
              <button data-action="show-correct">✎ Correct</button>
              <button data-action="dismiss">✕ Dismiss</button>
            </div>
            <div class="day-item-correct-form" data-id="${it.id}">
              <input type="text" data-field="title" value="${escapeHtml(it.title)}" aria-label="Corrected title">
              <input type="date" data-field="due_date" value="${it.due_date || ''}" aria-label="Corrected due date">
              <button class="primary" data-action="save-correct">Save</button>
            </div>` : '';
          return `
          <div class="day-item">
            <span class="day-item-dot" data-bg="${colorForCourse(it.course)}"></span>
            <div style="flex:1; min-width:0;">
              <div class="day-item-title">${escapeHtml(it.title)}</div>
              <div class="day-item-course" data-fg="${colorForCourse(it.course)}" style="font-weight:700;">${escapeHtml(it.course)}</div>
              <span class="day-item-status ${status}">${statusLabel}</span>
              ${snippet}
              ${it.document_id ? `<a href="/documents#doc-row-${it.document_id}" class="day-item-doc-link">📄 ${escapeHtml(it.document_name || 'View source document')}</a>` : ''}
              ${actions}
            </div>
          </div>`;
        }).join('');
        applyPendingBackgrounds(body);
      }
      dayPanelLastFocus = document.activeElement;
      document.getElementById('day-panel').classList.add('open');
      document.addEventListener('keydown', handleDayPanelKeydown);
      // Move focus into the dialog so keyboard/screen-reader users land inside it
      requestAnimationFrame(() => document.querySelector('.day-panel-close').focus());
    }

    // Delegated (day-panel-body is rebuilt on every openDayPanel call, so a
    // per-button listener would leak / miss new buttons) — handles Confirm,
    // Correct (reveals the inline edit form), Dismiss, and Save.
    document.getElementById('day-panel-body').addEventListener('click', async function(e) {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const container = btn.closest('[data-id]');
      const id = container && container.dataset.id;
      if (!id) return;

      if (action === 'show-correct') {
        const form = container.parentElement.querySelector('.day-item-correct-form');
        if (form) form.classList.add('open');
        return;
      }
      if (action === 'confirm') {
        await sendDeadlineStatus(id, 'confirmed');
        return;
      }
      if (action === 'dismiss') {
        if (!window.confirm('Dismiss this deadline? It will stop appearing in reminders.')) return;
        await sendDeadlineStatus(id, 'superseded');
        return;
      }
      if (action === 'save-correct') {
        const form = container;
        const title = form.querySelector('[data-field="title"]').value.trim();
        const dueDate = form.querySelector('[data-field="due_date"]').value;
        if (!title || !dueDate) { alert('Title and due date are required.'); return; }
        await sendDeadlineStatus(id, 'corrected', title, dueDate);
        return;
      }
    });

    // Posts a status change to the backend (see services/deadlines.py's
    // set_deadline_status()), then reloads /calendar-data so the calendar
    // grid, legend, and this panel all reflect the change immediately.
    async function sendDeadlineStatus(id, status, title, dueDate) {
      try {
        const res = await fetch(`/deadlines/${id}/confirm`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, title, due_date: dueDate }),
        });
        if (!res.ok) { alert('Could not save — please try again.'); return; }
        const updated = await res.json();
        await reloadDeadlines();
        openDayPanel((updated && updated.due_date) || currentPanelDate);
      } catch (e) {
        console.error('sendDeadlineStatus error', e);
        alert('Network error — please try again.');
      }
    }

    async function reloadDeadlines() {
      try {
        const res = await fetch('/calendar-data');
        const data = await res.json();
        allDeadlines = data.deadlines || [];
      } catch (e) {
        console.error('calendar-data fetch error', e);
        allDeadlines = [];
      }
      deadlinesByDate = {};
      allDeadlines.forEach(d => {
        if (!d.due_date) return;
        (deadlinesByDate[d.due_date] = deadlinesByDate[d.due_date] || []).push(d);
        colorForCourse(d.course);
      });
      renderLegend();
      renderCalendar();
    }

    function closeDayPanel() {
      document.getElementById('day-panel').classList.remove('open');
      document.removeEventListener('keydown', handleDayPanelKeydown);
      if (dayPanelLastFocus) { dayPanelLastFocus.focus(); dayPanelLastFocus = null; }
    }

    function handleDayPanelKeydown(e) {
      if (e.key === 'Escape') { closeDayPanel(); return; }
      if (e.key !== 'Tab') return;
      // Simple focus trap: keep Tab/Shift+Tab cycling within the dialog card
      const card = document.querySelector('.day-panel-card');
      const focusable = card.querySelectorAll('button, a[href]');
      if (focusable.length === 0) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }

    function changeMonth(delta) {
      viewMonth += delta;
      if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      renderCalendar();
    }

    function goToday() {
      const now = new Date();
      viewYear = now.getFullYear(); viewMonth = now.getMonth();
      renderCalendar();
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const linkedDate = params.get('date'); // e.g. from the dashboard's What's Due list
      const now = new Date();
      if (linkedDate && /^\d{4}-\d{2}-\d{2}$/.test(linkedDate)) {
        const [y, m] = linkedDate.split('-').map(Number);
        viewYear = y; viewMonth = m - 1;
      } else {
        viewYear = now.getFullYear(); viewMonth = now.getMonth();
      }

      try {
        const res = await fetch('/calendar-data');
        const data = await res.json();
        allDeadlines = data.deadlines || [];
      } catch (e) {
        console.error('calendar-data fetch error', e);
        allDeadlines = [];
      }

      deadlinesByDate = {};
      allDeadlines.forEach(d => {
        if (!d.due_date) return;
        (deadlinesByDate[d.due_date] = deadlinesByDate[d.due_date] || []).push(d);
        colorForCourse(d.course);
      });

      if (allDeadlines.length === 0) {
        document.getElementById('empty-state').style.display = 'block';
      }

      renderLegend();
      renderCalendar();

      if (linkedDate && /^\d{4}-\d{2}-\d{2}$/.test(linkedDate)) {
        openDayPanel(linkedDate);
      }
    }

    init();
  </script>

</body>
</html>
